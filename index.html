<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Writing Test - Grade 3 | Olivewood School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#23365a;--leaf:#3fae78;--blue:#4a6cf7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:700 1.15rem/1.6 Nunito,'Trebuchet MS',sans-serif;color:var(--ink);background:linear-gradient(#8fd3ff,#d9f2ff 50%,#fff3d1) fixed;overflow-x:hidden}
h1,h2,h3,.f,.btn{font-family:Fredoka,'Comic Sans MS',sans-serif}
#sc{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sun{position:absolute;top:5vh;right:7vw;width:100px;height:100px;border-radius:50%;background:radial-gradient(#fff6b0,#ffc93c);box-shadow:0 0 0 16px #ffc93c44,0 0 0 40px #ffc93c26;animation:pl 6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.07)}}
.cl{position:absolute;width:140px;height:44px;background:#fff;border-radius:44px;opacity:.9;animation:dr linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:60px;height:60px;left:22px;top:-30px}.cl::after{width:80px;height:80px;left:58px;top:-42px}
@keyframes dr{from{transform:translateX(-220px)}to{transform:translateX(110vw)}}
.wv{position:absolute;left:0;bottom:0;width:200%;height:110px;animation:wv 14s linear infinite}
.wv.b{height:80px;animation-duration:9s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-50%)}}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:18px 14px 130px}
.card{background:#fffffff2;border-radius:28px;padding:22px 26px;margin:22px 0;box-shadow:0 12px 32px #23365a24;border-top:10px solid var(--c,#4a6cf7)}
.hero{text-align:center;margin-top:5vh}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin:.2em 0;line-height:1.1;color:#2b3f8f}
.sch{font:600 1rem Fredoka,sans-serif;color:#5d6d93;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.chips span{background:#eaf1ff;border-radius:999px;padding:3px 14px;font-size:.95rem}
.hero input{font:700 1.2rem Nunito,sans-serif;width:min(100%,380px);padding:.6em 1em;border:3px solid #c6d4fb;border-radius:16px;color:var(--ink);text-align:center;outline:0}
.hero input:focus{border-color:var(--blue)}
.hero p{margin:.6em 0}
.btn{font-weight:600;font-size:1.3rem;border:0;border-radius:999px;padding:.65em 1.7em;color:#fff;background:linear-gradient(#ff8a5b,#ff5e62);box-shadow:0 6px 0 #c9403f;cursor:pointer;margin-top:14px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9403f}
.btn.alt{background:linear-gradient(#5f86ff,#3f5fe0);box-shadow:0 6px 0 #2a43a8}
.bar{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:14px;background:#ffffffee;border-radius:999px;padding:8px 18px;box-shadow:0 6px 18px #23365a2a;font-size:1rem}
.bar .pb{flex:1;height:14px;background:#e3e9f5;border-radius:99px;overflow:hidden}
.bar .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fae78,#ffc93c);border-radius:99px;transition:width .3s}
h2{display:flex;align-items:center;gap:12px;margin:0 0 10px;font-size:1.55rem;color:var(--c)}
.ic{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,#fff);font-size:1.7rem;flex:none}
.pg{margin:0 0 .5em;line-height:2.55}
.bl{display:inline-block;min-width:var(--w);max-width:100%;vertical-align:bottom;padding:0 .4em;margin:0 .1em;border-bottom:3px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:8px 8px 0 0;color:#1337b8;outline:0;line-height:1.5;word-break:break-word}
.bl:focus{background:#fff8c9;border-bottom-style:solid}
.bl:empty::before{content:attr(data-n);color:#9aa7c2}
.k1{--w:7ch}.k2{--w:12ch}.k3{--w:20ch}
.end{text-align:center}
.end p{margin:0}
#sheet{display:none}
.top{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;text-align:center}
.ring{--p:0;width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--leaf) calc(var(--p)*1%),#e3e9f5 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:15px;background:#fff;border-radius:50%}
.ring b{position:relative;font:700 2.3rem Fredoka,sans-serif;line-height:1}
.ring small{display:block;font-size:.9rem;color:#5d6d93;text-align:center}
.gr{font:700 4rem Fredoka,sans-serif;line-height:1;color:var(--leaf)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 18px;font-size:1rem;margin:12px 0}
.meta span{color:#5d6d93}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.st div{background:#f1f5ff;border-radius:16px;padding:10px;text-align:center;font-size:.95rem}
.st b{display:block;font:700 1.8rem Fredoka,sans-serif}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:1rem}
th,td{padding:9px 8px;text-align:left;border-bottom:2px solid #e6ecfa}
th{font-family:Fredoka,sans-serif;color:#5d6d93}
.mb{height:12px;min-width:90px;background:#e3e9f5;border-radius:99px;overflow:hidden}
.mb i{display:block;height:100%;border-radius:99px}
.ch{padding:1px 8px;border-radius:8px}
.ch sup{font-size:.6em;margin-left:3px}
.g2{background:#d6f5e3;color:#116b3e}.g1{background:#fff0c2;color:#8a5a00}.g0{background:#ffd9d6;color:#a3201a}
.lg{font-size:.9rem;display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.tip{background:#fff8dc;border-left:6px solid #ffc93c;border-radius:12px;padding:8px 14px;margin:8px 0}
.note{font-size:.9rem;color:#5d6d93}
@media(max-width:560px){body{font-size:1.05rem}.card{padding:18px 16px}.sun{width:70px;height:70px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media print{#sc,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="sc" aria-hidden="true">
<div class="sun"></div>
<div class="cl" style="top:14vh;animation-duration:70s"></div>
<div class="cl" style="top:30vh;transform:scale(.7);animation-duration:95s;animation-delay:-40s"></div>
<div class="cl" style="top:8vh;transform:scale(.55);animation-duration:120s;animation-delay:-80s"></div>
<svg class="wv" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60Q150 0 300 60T600 60T900 60T1200 60V120H0Z" fill="#1fa8c9" fill-opacity=".35"/></svg>
<svg class="wv b" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60Q150 0 300 60T600 60T900 60T1200 60V120H0Z" fill="#168fb0" fill-opacity=".5"/></svg>
</div>

<main>
<div id="start" class="card hero">
<p class="sch">Olivewood School, Mgbuoba, Port Harcourt</p>
<div class="chips"><span>Grade 3</span></div>
<p>Complete the passages with suitable words or sentences. Use your imagination and write neatly. Tap a blank and type your answer.</p>
<p><input id="nm" placeholder="Type your name here" maxlength="60" autocomplete="off"></p>
<button class="btn" id="go">Start writing</button>
</div>

<div id="test" style="display:none">
<div class="bar"><span class="f" id="pc">0 / 0</span><div class="pb"><i id="pf"></i></div><span class="f" id="tm">00:00</span></div>
<div id="secs"></div>
<div class="card end"><p>Read your work again. Are all the blanks filled?</p><button class="btn" id="sub">Submit my test</button></div>
</div>

<div id="sheet"></div>
</main>

<script>
const S=[
{t:"A. My Experience in the Library",ic:"📚",c:"#4a6cf7",tip:"Describe the library and what your book taught you in full sentences.",p:[
["Last week, I visited the ",1," with my teacher and classmates. The library was ",1," and well arranged. I saw many ",1," on the shelves. I picked a book about ",2,"."],
["I sat on a ",1," and began to read. The book taught me that ",3,". I enjoyed reading because ",3,". Before leaving the library, I ",3,". I felt very ",1," after my visit."]]},
{t:"B. A Day at the Beach",ic:"🏖️",c:"#1fa8c9",tip:"Add colourful details about what you saw and did at the beach.",p:[
["Last Saturday, I went to the ",1," with my family. The weather was ",1,", and the sea looked beautiful. I saw people ",3,"."],
["I played with ",2," on the sand. We also ",3,". I enjoyed watching the ",1," move gently on the water. At the end of the day, I felt ",1," because I had a wonderful time."]]},
{t:"C. Story Writing",ic:"🌟",c:"#e0802b",tip:"A good story needs a clear event, a surprise and an ending. Write longer ideas.",p:[
["One morning, I was walking home when I saw ",3,". I became surprised because ",3,". I decided to ",3,". Suddenly, ",3," happened."],
["In the end, ",3,". I learnt that ",3,"."]]},
{t:"D. My Best Friend",ic:"🤝",c:"#d9477f",tip:"Tell us more about why your friend is special to you.",p:[
["My best friend's name is ",1,". My friend is kind, helpful and ",1,". We enjoy ",2," together. My best friend always helps me when ",3,"."],
["I love my best friend because ",3,". I hope we will remain good friends for a very long time."]]}
];
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let total=0,t0,tick,name='';
S.forEach(s=>s.p.forEach(p=>p.forEach(x=>{if(typeof x=='number')total++})));
const pad=n=>String(n).padStart(2,'0'),fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);

let i=0;
$('#secs').innerHTML=S.map(s=>`<section class="card" style="--c:${s.c}"><h2><span class="ic">${s.ic}</span>${s.t}</h2>${s.p.map(p=>`<p class="pg">${p.map(x=>{if(typeof x!='number')return x;const j=++i;return `<span class="bl k${x}" contenteditable="true" role="textbox" spellcheck="true" autocapitalize="off" aria-label="Blank ${j}" data-n="${j}" data-k="${x}"></span>`}).join('')}</p>`).join('')}</section>`).join('');

function prog(){const f=[...document.querySelectorAll('.bl')].filter(b=>b.textContent.trim()).length;$('#pc').textContent=f+' / '+total;$('#pf').style.width=f/total*100+'%';return f}
$('#secs').addEventListener('input',prog);
$('#secs').addEventListener('keydown',e=>{if(e.key=='Enter')e.preventDefault()});
$('#secs').addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text').replace(/\s+/g,' '))});

$('#go').onclick=()=>{
  name=$('#nm').value.trim();
  if(!name){$('#nm').focus();$('#nm').style.borderColor='#ff5e62';$('#nm').placeholder='Please type your name first';return}
  $('#start').style.display='none';$('#test').style.display='block';prog();t0=Date.now();
  tick=setInterval(()=>$('#tm').textContent=fmt(Math.round((Date.now()-t0)/1000)),1000);
  window.scrollTo(0,0);
};

function mark(txt,k,all){
  const w=txt.trim().split(/\s+/).filter(Boolean);
  if(!w.length)return{p:0,n:'Not answered'};
  const letters=txt.replace(/[^a-z]/gi,'').length;
  const bad=letters<2||/[0-9]/.test(txt)||/(.)\1{3,}/i.test(txt)||w.some(x=>x.length>18||(x.replace(/[^a-z]/gi,'').length>2&&!/[aeiouy]/i.test(x)));
  if(bad)return{p:0,n:'These do not look like real words. Check your spelling'};
  const ideal=[0,1,2,5][k],uniq=new Set(w.map(x=>x.toLowerCase())).size/w.length;
  const copy=k>1&&all.filter(a=>a.trim().toLowerCase()==txt.trim().toLowerCase()).length>1;
  if(w.length<ideal)return{p:1,n:'Good start. Add more detail'};
  if((w.length>3&&uniq<.6)||copy)return{p:1,n:'Try different words in each blank'};
  return{p:2,n:'Great answer'};
}

$('#sub').onclick=()=>{
  const left=total-prog();
  if(left&&!confirm(`You left ${left} blank${left>1?'s':''} empty. Submit anyway?`))return;
  clearInterval(tick);
  const secs=Math.round((Date.now()-t0)/1000);
  const ans=[...document.querySelectorAll('.bl')].map(b=>b.textContent.trim().replace(/\s+/g,' '));
  const res=ans.map((a,j)=>mark(a,+document.querySelectorAll('.bl')[j].dataset.k,ans));
  let g=0;
  const secRes=S.map(s=>{let n=0,pts=0,max=0,html=s.p.map(p=>`<p class="pg" style="line-height:2.2">${p.map(x=>{if(typeof x!='number')return x;const r=res[g],a=ans[g];g++;n+=a?1:0;pts+=r.p;max+=2;return `<span class="ch g${r.p}" title="${r.n}">${esc(a)||'(empty)'}<sup>${r.p}/2</sup></span>`}).join('')}</p>`).join('');
    return{s,n,pts,max,html}});
  const pts=res.reduce((a,r)=>a+r.p,0),max=total*2,pct=Math.round(pts/max*100);
  const cnt=v=>res.filter(r=>r.p==v).length;
  const G=pct>=85?['A','Excellent work','Your writing is full of lovely ideas. Keep it up!']:pct>=70?['B','Very good','You wrote well. Add a few more details to shine even brighter.']:pct>=55?['C','Good effort','You are doing nicely. Try longer sentences and more interesting words.']:pct>=40?['D','Fair attempt','Keep practising. Read your work again and fill every blank with a full idea.']:['E','Keep trying','Do not give up! Read more stories and try writing a little every day.'];
  const col=pct>=70?'#3fae78':pct>=40?'#e0a21b':'#ff5e62';
  const weak=secRes.filter(r=>r.pts/r.max<.7);
  const date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  $('#test').style.display='none';
  const sh=$('#sheet');sh.style.display='block';
  sh.innerHTML=`
  <div class="card" style="--c:${col}">
    <p class="sch">Olivewood School, No. 6 Ohia Ada Lane, off N.T.A Road, Mgbuoba, Port Harcourt</p>
    <div class="meta"><div><span>Name</span><br>${esc(name)}</div><div><span>Date</span><br>${date}</div><div><span>Class</span><br>Grade Three (3)</div><div><span>Time taken</span><br>${fmt(secs)}</div></div>
    <div class="top">
      <div class="ring" style="--p:${pct};--leaf:${col}"><div><b>${pct}%</b><small>${pts} / ${max}</small></div></div>
      <div style="flex:1;min-width:230px"><div class="gr" style="color:${col}">${G[0]}</div><h3 style="margin:.2em 0">${G[1]}, ${esc(name.split(' ')[0])}!</h3><p style="margin:0">${G[2]}</p></div>
    </div>
    <div class="st"><div><b>${total-ans.filter(a=>!a).length}/${total}</b>Blanks answered</div><div><b style="color:#116b3e">${cnt(2)}</b>Great answers</div><div><b style="color:#8a5a00">${cnt(1)}</b>Need more detail</div><div><b style="color:#a3201a">${cnt(0)}</b>Empty or unclear</div></div>
  </div>
  <div class="card" style="--c:#4a6cf7"><h3 style="margin:0 0 8px">Score by section</h3><div class="tw"><table><tr><th>Section</th><th>Answered</th><th>Score</th><th style="width:30%">Progress</th></tr>
  ${secRes.map(r=>{const p=Math.round(r.pts/r.max*100);return `<tr><td>${r.s.ic} ${r.s.t}</td><td>${r.n}/${r.max/2}</td><td><b>${r.pts}/${r.max}</b> (${p}%)</td><td><div class="mb"><i style="width:${p}%;background:${r.s.c}"></i></div></td></tr>`}).join('')}
  <tr><td><b>Total</b></td><td><b>${total-ans.filter(a=>!a).length}/${total}</b></td><td><b>${pts}/${max}</b> (${pct}%)</td><td></td></tr></table></div></div>
  <div class="card" style="--c:#d9477f"><h3 style="margin:0">Your composition, marked</h3>
  <div class="lg"><span class="ch g2">2 Great answer</span><span class="ch g1">1 Needs more detail</span><span class="ch g0">0 Empty or unclear</span></div>
  ${secRes.map(r=>`<h3 style="color:${r.s.c};margin:14px 0 4px">${r.s.ic} ${r.s.t}</h3>${r.html}`).join('')}</div>
  <div class="card" style="--c:#ffc93c"><h3 style="margin:0 0 6px">How to improve</h3>
  ${weak.length?weak.map(r=>`<div class="tip"><b>${r.s.t}:</b> ${r.s.tip}</div>`).join(''):'<div class="tip">Brilliant! Every section was strong. Keep reading and writing every day.</div>'}
  <p class="note">Scores are marked automatically for completeness, effort and clear words (2 marks per blank). Your teacher will check your ideas and spelling for the final mark.</p>
  <div class="noprint end"><button class="btn alt" onclick="print()">Print score sheet</button> <button class="btn" onclick="location.reload()">Start again</button></div></div>`;
  window.scrollTo(0,0);
};
</script>
</body>
</html>
